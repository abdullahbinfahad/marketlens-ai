<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product intelligence — MarketLens AI</title>
<style>
:root{--bg:#f5f7fb;--ink:#111827;--muted:#667085;--line:#dfe4ec;--card:#ffffffcc;--blue:#1769e0;--green:#087443;--amber:#9a5b00;--red:#b42318;--shadow:0 18px 60px #18253b16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e9f1ff,transparent 32%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{font-weight:700;letter-spacing:-.02em}.back{color:var(--blue);text-decoration:none;font-weight:600}.hero{padding:38px;border:1px solid #ffffffaa;background:#ffffffb8;backdrop-filter:blur(24px);border-radius:28px;box-shadow:var(--shadow)}.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;font-weight:800}.hero h1{font-size:clamp(2rem,5vw,4.6rem);line-height:1;letter-spacing:-.065em;margin:14px 0 10px}.sub{color:var(--muted);font-size:1rem}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{padding:26px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);border-radius:22px;box-shadow:0 8px 28px #18253b0a}.card h2,.card h3{margin:0 0 12px;letter-spacing:-.03em}.score{font-size:4rem;font-weight:700;letter-spacing:-.08em}.badge{display:inline-block;padding:6px 10px;border-radius:99px;font-size:.75rem;font-weight:800}.GO{color:var(--green);background:#dff7eb}.CAUTION{color:var(--amber);background:#fff1cf}.PASS{color:var(--red);background:#fee4e2}.VERIFY{color:#475467;background:#eaecf0}.signal{display:grid;grid-template-columns:150px 1fr 42px;align-items:center;gap:10px;margin:16px 0;font-size:.85rem}.signal label{color:var(--muted)}.bar{height:8px;border-radius:99px;background:#e5e9f0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#57b3ff,#1769e0);border-radius:99px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fact{padding:14px;border:1px solid var(--line);border-radius:14px}.fact span{display:block;color:var(--muted);font-size:.74rem;margin-bottom:5px}.fact b{font-size:.95rem}.source{word-break:break-word;color:var(--blue)}.notice{padding:14px;border-radius:14px;background:#eef5ff;color:#344054;line-height:1.55;font-size:.9rem}.empty{text-align:center;margin:20vh auto;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding:25px}.facts{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand">◎ MarketLens AI</div><a class="back" href="index.html">← Back to search</a></header><div id="app"></div></main>
<script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=JSON.parse(sessionStorage.getItem('marketlens.selectedProduct')||'null');
if(!p){document.getElementById('app').innerHTML='<div class="empty"><h2>No product selected</h2><p>Return to search and select a result.</p><a class="back" href="index.html">Open search</a></div>'}else{const s=p.score||{},e=p.evidence_type==='knowledge',signals=[['Demand',s.demand],['Profit',s.profit],['Risk',s.risk],['Competition gap',s.gap]];document.title=esc(p.product_name)+' — MarketLens AI';document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">${e?'Knowledge evidence':'Product evidence'} · ${esc(p.provider)}</div><h1>${esc(p.product_name)}</h1><p class="sub">${esc(p.brand||'Brand unavailable')} · ${esc(p.main_category||'General')} ${p.exact_match?'· Exact verified identity':''}</p></section><div class="grid"><section class="card"><h2>Decision support</h2><div class="score">${Number(s.final??0).toFixed(1)}<small style="font-size:1rem;color:var(--muted)"> / 100</small></div><p><span class="badge ${esc(s.verdict||'PASS')}">${esc(s.verdict||'PASS')}</span> <span style="color:var(--muted)">Evidence confidence ${esc(s.confidence??0)}%</span></p>${signals.map(x=>`<div class="signal"><label>${x[0]}</label><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(x[1]||0)))}%"></i></div><b>${Number(x[1]||0).toFixed(0)}</b></div>`).join('')}</section><section class="card"><h2>Product overview</h2><p>${esc(p.product_description||'No description supplied by the source.')}</p><div class="facts"><div class="fact"><span>Price</span><b>${p.selling_price_usd==null?'Unavailable':'$'+Number(p.selling_price_usd).toFixed(2)}</b></div><div class="fact"><span>Rating</span><b>${p.average_rating==null?'Unavailable':Number(p.average_rating).toFixed(1)+'/5'}</b></div><div class="fact"><span>Reviews</span><b>${p.total_reviews_count==null?'Unavailable':Number(p.total_reviews_count).toLocaleString()}</b></div><div class="fact"><span>Evidence type</span><b>${e?'Knowledge / reference':'Market observation'}</b></div></div></section></div><section class="card"><h2>Interpretation</h2><div class="notice">${e?'This source helps identify or explain the searched subject. It is not a marketplace price or sales signal, so market-launch conclusions should be treated as low-confidence until marketplace evidence is available.':s.verdict==='GO'?'Observed signals support further validation. Confirm supplier terms, compliance, inventory, and current market prices before investing.':s.verdict==='CAUTION'?'Signals are mixed or incomplete. Verify demand, margin, competition, and source freshness before making a launch decision.':'Current evidence does not support a confident launch decision. This is a research priority label, not a claim that the product cannot sell.'}</div></section><section class="card"><h2>Source and provenance</h2><p class="small">Provider: ${esc(p.provider||'Unavailable')}<br>Observed fields: ${esc((p.observed_fields||[]).join(', ')||'identity only')}<br>Source: <a class="source" target="_blank" rel="noreferrer" href="${esc(p.source_url||'#')}">${esc(p.source_url||'Provider endpoint')}</a></p></section>`}
</script></body></html>
